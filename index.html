<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dino Run</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f7f7f7;
}


/* =====================================================
   GAME
===================================================== */

.game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#f7f7f7;

    transition:background 1.5s ease;
}

.game.night{
    background:#111827;
}


/* =====================================================
   SCORE
===================================================== */

.score{
    position:absolute;
    top:22px;
    right:30px;
    z-index:60;

    color:#555;

    font-family:monospace;
    font-size:18px;
    letter-spacing:2px;

    transition:color 1s;
}

.game.night .score{
    color:#e5e7eb;
}


/* =====================================================
   SKY
===================================================== */

.sky{
    position:absolute;
    inset:0;
    pointer-events:none;
}


/* =====================================================
   CLOUD
===================================================== */

.cloud{
    position:absolute;

    width:115px;
    height:50px;

    z-index:2;

    opacity:.85;

    transition:opacity 1.5s;
}

.cloud-body{
    position:absolute;

    left:12px;
    bottom:0;

    width:95px;
    height:27px;

    background:#dedede;

    border-radius:
        30px 35px 20px 20px;
}

.cloud-part{
    position:absolute;

    background:#dedede;

    border-radius:50%;
}

.cloud-part.one{
    width:36px;
    height:36px;

    left:20px;
    bottom:10px;
}

.cloud-part.two{
    width:48px;
    height:48px;

    left:43px;
    bottom:4px;
}

.cloud-part.three{
    width:32px;
    height:32px;

    left:76px;
    bottom:10px;
}

.game.night .cloud{
    opacity:.4;
}

.game.night .cloud-body,
.game.night .cloud-part{
    background:#374151;
}


/* =====================================================
   MOON
===================================================== */

.moon{
    position:absolute;

    top:65px;
    right:12%;

    width:64px;
    height:64px;

    border-radius:50%;

    background:#f9fafb;

    box-shadow:
        0 0 25px rgba(255,255,255,.4);

    opacity:0;

    transition:opacity 1.5s;

    z-index:1;
}

.game.night .moon{
    opacity:1;
}


/* =====================================================
   STARS
===================================================== */

.stars{
    position:absolute;
    inset:0;

    opacity:0;

    transition:opacity 1.5s;

    z-index:1;
}

.game.night .stars{
    opacity:1;
}

.star{
    position:absolute;

    width:3px;
    height:3px;

    background:white;

    border-radius:50%;

    box-shadow:
        0 0 5px white;
}


/* =====================================================
   GROUND
===================================================== */

.ground{

    position:absolute;

    left:0;
    bottom:100px;

    width:100%;
    height:2px;

    background:#535353;

    z-index:5;

    transition:background 1s;
}

.game.night .ground{
    background:#d1d5db;
}

.ground-details{

    position:absolute;

    top:9px;
    left:0;

    width:100%;
    height:3px;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            transparent 30px,
            #777 30px,
            #777 50px
        );

    opacity:.5;
}


/* =====================================================
   DINO
===================================================== */

.dino{

    position:absolute;

    left:100px;

    /*
       DINO SEKARANG LEBIH TINGGI
       DARI POSISI SEBELUMNYA
    */

    bottom:140px;

    width:60px;
    height:65px;

    z-index:10;
}


/* =====================================================
   DINO BODY
===================================================== */

.dino .body{

    position:absolute;

    left:17px;
    top:22px;

    width:30px;
    height:30px;

    background:#444;
}


/* =====================================================
   DINO HEAD
===================================================== */

.dino .head{

    position:absolute;

    left:27px;
    top:5px;

    width:27px;
    height:27px;

    background:#444;
}


/* =====================================================
   DINO SNOUT
===================================================== */

.dino .snout{

    position:absolute;

    left:48px;
    top:17px;

    width:12px;
    height:10px;

    background:#444;
}


/* =====================================================
   DINO NECK
===================================================== */

.dino .neck{

    position:absolute;

    left:22px;
    top:14px;

    width:15px;
    height:24px;

    background:#444;
}


/* =====================================================
   DINO TAIL
===================================================== */

.dino .tail1{

    position:absolute;

    left:5px;
    top:30px;

    width:23px;
    height:9px;

    background:#444;

    transform:skewY(-25deg);
}

.dino .tail2{

    position:absolute;

    left:0;
    top:25px;

    width:13px;
    height:8px;

    background:#444;

    transform:skewY(-35deg);
}


/* =====================================================
   DINO EYE
===================================================== */

.dino .eye{

    position:absolute;

    left:45px;
    top:11px;

    width:5px;
    height:5px;

    background:white;

    z-index:5;
}


/* =====================================================
   DINO ARM
===================================================== */

.dino .arm{

    position:absolute;

    left:38px;
    top:35px;

    width:15px;
    height:6px;

    background:#444;

    transform:rotate(20deg);
}


/* =====================================================
   DINO LEGS
===================================================== */

.dino .leg{

    position:absolute;

    bottom:0;

    width:8px;
    height:19px;

    background:#444;
}

.dino .leg.back{
    left:20px;
}

.dino .leg.front{
    left:35px;
}


/* =====================================================
   RUNNING ANIMATION
===================================================== */

.dino.running .leg.back{

    animation:
        legBack .18s infinite alternate;
}

.dino.running .leg.front{

    animation:
        legFront .18s infinite alternate;
}

@keyframes legBack{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-4px);
    }

}

@keyframes legFront{

    from{
        transform:translateY(-4px);
    }

    to{
        transform:translateY(0);
    }

}


/* =====================================================
   OBSTACLE
===================================================== */

.obstacle{

    position:absolute;

    right:-120px;

    /*
       KAKTUS SEJAJAR DENGAN
       POSISI DINO
    */

    bottom:140px;

    height:65px;

    z-index:8;
}


/* =====================================================
   CACTUS PART
===================================================== */

.cactus-part{

    position:absolute;

    background:#4b4b4b;

    border-radius:4px;
}


/* =====================================================
   SMALL CACTUS
===================================================== */

.type-small{

    width:18px;
    height:38px;
}

.type-small .main{

    width:18px;
    height:38px;

    left:0;
    bottom:0;
}

.type-small .arm-left{

    width:10px;
    height:20px;

    left:-7px;
    bottom:8px;
}

.type-small .arm-right{

    width:10px;
    height:17px;

    right:-7px;
    bottom:15px;
}


/* =====================================================
   TALL CACTUS
===================================================== */

.type-tall{

    width:23px;
    height:60px;
}

.type-tall .main{

    width:23px;
    height:60px;

    left:0;
    bottom:0;
}

.type-tall .arm-left{

    width:12px;
    height:27px;

    left:-9px;
    bottom:15px;
}

.type-tall .arm-right{

    width:12px;
    height:30px;

    right:-9px;
    bottom:22px;
}


/* =====================================================
   DOUBLE CACTUS
===================================================== */

.type-double{

    width:47px;
    height:50px;
}

.type-double .c1{

    width:19px;
    height:45px;

    left:0;
    bottom:0;
}

.type-double .c2{

    width:19px;
    height:50px;

    right:0;
    bottom:0;
}

.type-double .arm1{

    width:10px;
    height:23px;

    left:-7px;
    bottom:13px;
}

.type-double .arm2{

    width:10px;
    height:24px;

    right:10px;
    bottom:18px;
}


/* =====================================================
   TRIPLE CACTUS
===================================================== */

.type-triple{

    width:70px;
    height:55px;
}

.type-triple .c1{

    position:absolute;

    left:0;
    bottom:0;

    width:18px;
    height:42px;
}

.type-triple .c2{

    position:absolute;

    left:25px;
    bottom:0;

    width:20px;
    height:55px;
}

.type-triple .c3{

    position:absolute;

    right:0;
    bottom:0;

    width:18px;
    height:38px;
}


/* =====================================================
   START SCREEN
===================================================== */

.start-screen{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    text-align:center;

    background:#f7f7f7;

    z-index:90;

    transition:
        opacity .4s ease,
        visibility .4s ease;
}

.game.night .start-screen{

    background:#111827;
}


/* =====================================================
   START DINO
===================================================== */

.start-dino{

    position:relative;

    width:60px;
    height:65px;

    margin-bottom:10px;

    animation:
        startDino .8s infinite alternate;
}

.start-dino .body{

    position:absolute;

    left:17px;
    top:22px;

    width:30px;
    height:30px;

    background:#444;
}

.start-dino .head{

    position:absolute;

    left:27px;
    top:5px;

    width:27px;
    height:27px;

    background:#444;
}

.start-dino .snout{

    position:absolute;

    left:48px;
    top:17px;

    width:12px;
    height:10px;

    background:#444;
}

.start-dino .neck{

    position:absolute;

    left:22px;
    top:14px;

    width:15px;
    height:24px;

    background:#444;
}

.start-dino .tail1{

    position:absolute;

    left:5px;
    top:30px;

    width:23px;
    height:9px;

    background:#444;

    transform:skewY(-25deg);
}

.start-dino .tail2{

    position:absolute;

    left:0;
    top:25px;

    width:13px;
    height:8px;

    background:#444;

    transform:skewY(-35deg);
}

.start-dino .eye{

    position:absolute;

    left:45px;
    top:11px;

    width:5px;
    height:5px;

    background:white;
}

.start-dino .arm{

    position:absolute;

    left:38px;
    top:35px;

    width:15px;
    height:6px;

    background:#444;
}

.start-dino .leg{

    position:absolute;

    bottom:0;

    width:8px;
    height:19px;

    background:#444;
}

.start-dino .leg.one{
    left:20px;
}

.start-dino .leg.two{
    left:35px;
}


@keyframes startDino{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-5px);
    }

}


/* =====================================================
   START TITLE
===================================================== */

.start-title{

    font-size:38px;

    letter-spacing:5px;

    color:#444;

    margin-bottom:18px;
}

.game.night .start-title{

    color:white;
}


/* =====================================================
   START INSTRUCTION
===================================================== */

.start-instruction{

    font-size:19px;

    color:#666;

    margin-bottom:8px;
}

.start-instruction b{

    color:#333;
}

.game.night .start-instruction{

    color:#d1d5db;
}

.game.night .start-instruction b{

    color:white;
}

.start-tap{

    font-size:13px;

    color:#999;
}


/* =====================================================
   START HIDE
===================================================== */

.start-screen.hide{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


/* =====================================================
   BOTTOM TEXT
===================================================== */

.start-text{

    position:absolute;

    bottom:55px;

    left:50%;

    transform:
        translateX(-50%);

    color:#888;

    font-size:14px;

    white-space:nowrap;

    z-index:20;
}

.game.night .start-text{

    color:#9ca3af;
}


/* =====================================================
   GAME OVER
===================================================== */

.game-over{

    position:absolute;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    text-align:center;

    background:
        rgba(247,247,247,.92);

    z-index:100;
}

.game-over.show{

    display:flex;
}

.game.night .game-over{

    background:
        rgba(17,24,39,.94);
}


/* =====================================================
   GAME OVER TITLE
===================================================== */

.game-over h1{

    font-size:40px;

    color:#333;

    margin-bottom:18px;
}

.game.night .game-over h1{

    color:white;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    min-height:34px;

    max-width:600px;

    padding:0 20px;

    margin-bottom:28px;

    font-size:21px;

    line-height:1.5;

    color:#555;
}

.game.night .message{

    color:#d1d5db;
}


/* =====================================================
   RETRY BUTTON
===================================================== */

.retry{

    border:0;

    padding:
        13px 32px;

    background:#333;

    color:white;

    font-size:16px;

    font-weight:bold;

    border-radius:6px;

    cursor:pointer;

    transition:.2s;
}

.retry:hover{

    background:#111;

    transform:
        translateY(-2px);
}

.retry:active{

    transform:
        scale(.96);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .dino{

        left:50px;

        bottom:140px;

    }


    .obstacle{

        bottom:140px;

    }


    .score{

        top:18px;
        right:18px;

        font-size:14px;

    }


    .game-over h1{

        font-size:30px;

    }


    .message{

        font-size:18px;

    }


    .start-title{

        font-size:30px;

    }


    .start-instruction{

        font-size:17px;

    }


    .moon{

        right:15%;

    }

}

</style>
</head>


<body>


<div class="game" id="game">


    <!-- =================================================
         SCORE
    ================================================== -->

    <div class="score">

        JARAK:

        <span id="score">
            00000
        </span>

        m

    </div>


    <!-- =================================================
         SKY
    ================================================== -->

    <div class="sky">


        <!-- BULAN -->

        <div class="moon"></div>


        <!-- BINTANG -->

        <div class="stars">

            <span
                class="star"
                style="top:10%;left:8%;">
            </span>

            <span
                class="star"
                style="top:18%;left:18%;">
            </span>

            <span
                class="star"
                style="top:8%;left:30%;">
            </span>

            <span
                class="star"
                style="top:25%;left:42%;">
            </span>

            <span
                class="star"
                style="top:13%;left:55%;">
            </span>

            <span
                class="star"
                style="top:29%;left:68%;">
            </span>

            <span
                class="star"
                style="top:9%;left:78%;">
            </span>

                class="star"
                style="top:22%;left:91%;">

        <div class="cloud">

        class="start-screen"

    >


        <div class="start-dino">

    ================================================== -->

    <div

        <div class="body"></div>

        SPACE / ↑ / TAP untuk melompat

            class="message"

        >

        </button>

<script>

/* =====================================================
   ELEMENT
===================================================== */

const game =
    document.getElementById("game");

const dino =
    document.getElementById("dino");

const obstacle =
    document.getElementById("obstacle");

const scoreText =
    document.getElementById("score");

const gameOver =
    document.getElementById("gameOver");

const message =
    document.getElementById("message");

const retry =
    document.getElementById("retry");

const startScreen =
    document.getElementById("startScreen");

const clouds =
    document.querySelectorAll(".cloud");


/* =====================================================
   GAME STATE
===================================================== */

let gameRunning = false;

let gameStarted = false;


/* =====================================================
   DINO PHYSICS
===================================================== */

let jumping = false;


/*
   POSISI DINO SEKARANG 140px
   DARI BAWAH
*/

let dinoBottom = 140;


let velocityY = 0;

const gravity = 0.8;

const jumpPower = 14;


/* =====================================================
   SPEED
===================================================== */

let speed = 7;


/* =====================================================
   OBSTACLE
===================================================== */

let obstacleRight = -120;


/* =====================================================
   DISTANCE
===================================================== */

let distance = 0;


/* =====================================================
   CLOUD DATA
===================================================== */

let cloudData = [

    {
        x:20,
        y:16,
        speed:.035
    },

    {
        x:55,
        y:29,
        speed:.025
    },

    {
        x:80,
        y:12,
        speed:.045
    },

    {
        x:105,
        y:40,
        speed:.020
    }

];


/* =====================================================
   GAME OVER MESSAGES
===================================================== */

const words = [

    "Jangan menyerah. Coba lagi! 🔥",

    "Sedikit lagi, kamu pasti bisa.",

    "Perjalananmu belum selesai.",

    "Ayo bangkit dan coba lagi!",

    "Kali ini belum berhasil.",

    "Jangan berhenti di sini.",

    "Coba lagi dan pecahkan rekor!",

    "Kamu bisa lebih jauh dari ini.",

    "Satu kegagalan bukan akhir.",

    "Ayo lanjutkan perjalananmu! 🚀",

    "Belum waktunya berhenti.",

    "Masih ada kesempatan berikutnya."

];


let lastWord = -1;


/* =====================================================
   RANDOM MESSAGE
===================================================== */

function getRandomWord(){

    let index;


    do{

        index =
            Math.floor(
                Math.random() *
                words.length
            );

    }

    while(
        index === lastWord
        &&
        words.length > 1
    );


    lastWord = index;


    return words[index];

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    if(gameStarted)
        return;


    gameStarted = true;

    gameRunning = true;


    startScreen.classList.add(
        "hide"
    );


    dino.classList.add(
        "running"
    );


    createObstacle();

}


/* =====================================================
   JUMP
===================================================== */

function jump(){

    /*
       Kalau belum mulai,
       SPACE / TAP memulai game.
    */

    if(!gameStarted){

        startGame();

        return;

    }


    if(!gameRunning)
        return;


    if(!jumping){

        jumping = true;

        velocityY =
            jumpPower;

    }

}


/* =====================================================
   DINO UPDATE
===================================================== */

function updateDino(){

    if(!jumping)
        return;


    dinoBottom +=
        velocityY;


    velocityY -=
        gravity;


    dino.style.bottom =
        dinoBottom + "px";


    /*
       Kembali ke posisi dasar
       140px.
    */

    if(
        dinoBottom <= 140
    ){

        dinoBottom = 140;

        velocityY = 0;

        jumping = false;


        dino.style.bottom =
            "140px";

    }

}


/* =====================================================
   CREATE OBSTACLE
===================================================== */

function createObstacle(){

    obstacle.className =
        "obstacle";


    const type =
        Math.floor(
            Math.random() * 4
        );


    /* SMALL */

    if(type === 0){

        obstacle.classList.add(
            "type-small"
        );


        obstacle.innerHTML = `

            <div
                class="cactus-part main">
            </div>

            <div
                class="cactus-part arm-left">
            </div>

            <div
                class="cactus-part arm-right">
            </div>

        `;

    }


    /* TALL */

    else if(type === 1){

        obstacle.classList.add(
            "type-tall"
        );


        obstacle.innerHTML = `

            <div
                class="cactus-part main">
            </div>

            <div
                class="cactus-part arm-left">
            </div>

            <div
                class="cactus-part arm-right">
            </div>

        `;

    }


    /* DOUBLE */

    else if(type === 2){

        obstacle.classList.add(
            "type-double"
        );


        obstacle.innerHTML = `

            <div
                class="cactus-part c1">
            </div>

            <div
                class="cactus-part c2">
            </div>

            <div
                class="cactus-part arm1">
            </div>

            <div
                class="cactus-part arm2">
            </div>

        `;

    }


    /* TRIPLE */

    else{

        obstacle.classList.add(
            "type-triple"
        );


        obstacle.innerHTML = `

            <div
                class="c1 cactus-part">
            </div>

            <div
                class="c2 cactus-part">
            </div>

            <div
                class="c3 cactus-part">
            </div>

        `;

    }

}


/* =====================================================
   OBSTACLE UPDATE
===================================================== */

function updateObstacle(){

    if(!gameRunning)
        return;


    obstacleRight +=
        speed;


    obstacle.style.right =
        obstacleRight + "px";


    if(
        obstacleRight >
        window.innerWidth + 100
    ){

        obstacleRight =
            -(120 +
            Math.random() * 180);


        obstacle.style.right =
            obstacleRight + "px";


        createObstacle();

    }

}


/* =====================================================
   DISTANCE
===================================================== */

function updateDistance(){

    if(!gameRunning)
        return;


    distance +=
        speed * .015;


    const currentDistance =
        Math.floor(
            distance
        );


    scoreText.textContent =
        String(
            currentDistance
        ).padStart(
            5,
            "0"
        );


    /*
       Kecepatan meningkat
       perlahan.
    */

    speed =
        7 +
        Math.min(
            distance / 100 * .4,
            7
        );


    /*
       Pergantian siang/malam
    */

    const cycle =
        Math.floor(
            distance / 300
        );


    if(
        cycle % 2 === 1
    ){

        game.classList.add(
            "night"
        );

    }

    else{

        game.classList.remove(
            "night"
        );

    }

}


/* =====================================================
   CLOUD MOVEMENT
===================================================== */

function updateClouds(){

    if(!gameRunning)
        return;


    cloudData.forEach(
        (cloud,index)=>{


            cloud.x -=
                cloud.speed;


            if(
                cloud.x < -20
            ){

                cloud.x =
                    105 +
                    Math.random() * 20;


                cloud.y =
                    10 +
                    Math.random() * 40;

            }


            clouds[index].style.left =
                cloud.x + "%";


            clouds[index].style.top =
                cloud.y + "%";

        }
    );

}


/* =====================================================
   COLLISION
===================================================== */

function checkCollision(){

    if(!gameRunning)
        return;


    const d =
        dino.getBoundingClientRect();


    const o =
        obstacle.getBoundingClientRect();


    const margin = 6;


    const collision =

        d.left + margin <
        o.right - margin

        &&

        d.right - margin >
        o.left + margin

        &&

        d.top + margin <
        o.bottom - margin

        &&

        d.bottom - margin >
        o.top + margin;


    if(collision){

        endGame();

    }

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(){

    gameRunning = false;


    dino.classList.remove(
        "running"
    );


    message.textContent =
        getRandomWord();


    gameOver.classList.add(
        "show"
    );

}


/* =====================================================
   RESET GAME
===================================================== */

function resetGame(){

    gameRunning = true;

    gameStarted = true;


    jumping = false;


    dinoBottom = 140;

    velocityY = 0;


    speed = 7;

    distance = 0;


    obstacleRight = -120;


    dino.style.bottom =
        "140px";


    obstacle.style.right =
        "-120px";


    scoreText.textContent =
        "00000";


    game.classList.remove(
        "night"
    );


    dino.classList.add(
        "running"
    );


    gameOver.classList.remove(
        "show"
    );


    startScreen.classList.add(
        "hide"
    );


    createObstacle();


    cloudData = [

        {
            x:20,
            y:16,
            speed:.035
        },

        {
            x:55,
            y:29,
            speed:.025
        },

        {
            x:80,
            y:12,
            speed:.045
        },

        {
            x:105,
            y:40,
            speed:.020
        }

    ];

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

    updateDino();

    updateObstacle();

    updateDistance();

    updateClouds();

    checkCollision();


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code === "Space"
            ||
            event.code === "ArrowUp"
        ){

            event.preventDefault();

            jump();

        }

    }
);


/* =====================================================
   MOUSE
===================================================== */

game.addEventListener(
    "mousedown",
    function(event){

        if(
            event.target === retry
        )
            return;


        jump();

    }
);


/* =====================================================
   TOUCH
===================================================== */

game.addEventListener(
    "touchstart",
    function(event){

        if(
            event.target === retry
        )
            return;


        event.preventDefault();


        jump();

    },
    {
        passive:false
    }
);


/* =====================================================
   RETRY
===================================================== */

retry.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        resetGame();

    }
);

</script>
